name: Build luci-app-mosdns

on:
  workflow_dispatch:
    inputs:
      openwrt_tag:
        description: "OpenWrt/ImmortalWrt release tag"
        required: true
        default: "openwrt-24.10"
        type: choice
        options:
          - openwrt-24.10
          - openwrt-25.12

jobs:
  build:
    name: Build luci-app-mosdns for ${{ github.event.inputs.openwrt_tag }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Build preparation
        env:
          OPENWRT_TAG: ${{ github.event.inputs.openwrt_tag }}
        run: |
          sed -i '/golang-package/a \\tGO_PKG_DEFAULT_LDFLAGS:=-w -s -extldflags "-static"' mosdns/Makefile
          sed -i '/golang-package/a \\tGO_PKG_DEFAULT_LDFLAGS:=-w -s -extldflags "-static"' geo2txt/Makefile
          git clone https://github.com/sbwml/v2ray-geodata
          echo "EFFECTIVE_ARCH=aarch64_generic" >> $GITHUB_ENV
          echo "ARCH=aarch64_generic-${OPENWRT_TAG}" >> $GITHUB_ENV
          echo "OPENWRT_TAG=${OPENWRT_TAG}" >> $GITHUB_ENV

      - name: Build Packages
        uses: sbwml/openwrt-gh-action-sdk@go1.27
        env:
          FEEDNAME: packages_ci
          PACKAGES: luci-app-mosdns
          NO_REFRESH_CHECK: true

      - name: Create compress files
        continue-on-error: true
        run: |
          ls -laR bin/packages/${{ env.EFFECTIVE_ARCH }}/packages_ci
          tar -zcvf ${{ env.ARCH }}.tar.gz -C bin/packages/${{ env.EFFECTIVE_ARCH }}/ packages_ci

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: luci-app-mosdns-${{ env.ARCH }}
          path: ${{ env.ARCH }}.tar.gz
          if-no-files-found: error
          retention-days: 30
